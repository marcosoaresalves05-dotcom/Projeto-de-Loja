<!DOCTYPE html>
<html lang="pt-BR">

    <head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial0-scale=1"> <!-- Dá instruções ao navegador de como controlar dimensões para poder se adaptar ao dispositivo vendo o site no momento -->
        <link rel="stylesheet" href="styles.css"> <!--Chamando o arquivo CSS pra fazer a estilização da página-->
        <title>Pulsar Informática</title> <!-- Nome que vai aparecer na barra de pesquisa, não na página inicial -->
    </head>

<section id="cadastro">
    <h1>PÁGINA PLACEHOLDER</h1>
        <h2>Entrar</h2>
        
        <form action="" method="post">
            
            <fieldset>
                <legend>Seus dados</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                        placeholder="Como você quer ser chamado"
                        required minlength="3" maxlength="80">
                
                <label for="email">E-Mail:</label>
                <input type="email" id="email" name="email"
                        placeholder="voce@exemplo.com" required>

                <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone"
                 pattern="[0-9]{2} [0-9]{5}-[0-9]{4}"
                 placeholder="11 99999-9999">
            </fieldset>

            <fieldset>
                <legend>Sua mensagem</legend>

                <label for="assunto">Assunto</label>
                    <select id="assunto" name="assunto">
                        <option value="duvida">Dúvida sobre um produto</option>
                        <option value="pedido">Acompanhar um pedido</option>
                        <option value="troca">Troca ou devolução</option>
                        <option value="parceria">Parceria</option>
                    </select>

                <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="4"
                                placeholder="Escreva aqui o que você precisa..."></textarea>

                <label>
                    <input type="checkbox" name="aceite" required>
                    Aceito receber novidades da loja
                </label>
                <button type="submit">Enviar Cadastro</button>
            </fieldset>

        </form>
        <a href="index.html">
            <button id="retorno" type="button">Voltar</button>
        </a>
    </section>

    <script src="script.js"></script>

    </body>

</html>
